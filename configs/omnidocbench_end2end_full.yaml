# OmniDocBench v1.6 full set (1651 pages), leaderboard metrics. prediction.data_path is
# rewritten per run by run_all_benchmarks.py into configs/generated/.
end2end_eval:
  metrics:
    text_block:
      metric:
      - Edit_dist
    display_formula:
      metric:
      - Edit_dist
      - CDM
      cdm_workers: 12
    table:
      metric:
      - TEDS
      - Edit_dist
      teds_workers: 12
    reading_order:
      metric:
      - Edit_dist
  dataset:
    dataset_name: end2end_dataset
    ground_truth:
      data_path: ./OmniDocBench_dataset/OmniDocBench.json
    prediction:
      data_path: ./outputs/RUN_NAME
    match_method: quick_match
    match_workers: 12
    quick_match_truncated_timeout_sec: 300
    match_timeout_sec: 420
    timeout_fallback_max_chunk_span: 10
    timeout_fallback_order_penalty: 0.10
