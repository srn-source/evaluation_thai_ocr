end2end_eval:
  metrics:
    text_block:
      metric:
        - Edit_dist
    display_formula:
      metric:
        - Edit_dist
        - CDM_plain
    table:
      metric:
        - TEDS
        - Edit_dist
    reading_order:
      metric:
        - Edit_dist
  dataset:
    dataset_name: end2end_dataset
    ground_truth:
      data_path: ./data/ground_truth.json
    prediction:
      # rewritten per run: ./outputs/RUN_NAME_<lang> is a symlink to ./outputs/RUN_NAME, so the
      # en and th results get different names under ./result/
      data_path: ./outputs/RUN_NAME_en
    match_method: quick_match
    filter:
      language: en
